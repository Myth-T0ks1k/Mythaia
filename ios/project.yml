# XcodeGen spec for Mythaia Pro on iOS. The .xcodeproj is generated, not
# committed:   brew install xcodegen && cp Config.example.xcconfig Config.xcconfig && xcodegen
name: Mythaia
options:
  bundleIdPrefix: com.mythaia
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

# Team id and bundle id live in Config.xcconfig (not committed); see Config.example.xcconfig.
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    DEAD_CODE_STRIPPING: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"

packages:
  MythaiaKit:
    path: Packages/MythaiaKit

targets:
  Mythaia:
    type: application
    platform: iOS
    sources:
      - path: Mythaia
        excludes: ["**/*.md"]
      # One routing rules database for every platform: the one the Android app ships.
      - path: ../app/src/main/assets/Rules.db
        buildPhase: resources
    dependencies:
      - package: MythaiaKit
      - target: MythaiaTunnel
      - target: MythaiaWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MYTHAIA_BUNDLE_ID)
        PRODUCT_NAME: Mythaia
        INFOPLIST_FILE: Mythaia/Info.plist
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Mythaia Pro
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_ENTITLEMENTS: Mythaia/Mythaia.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []

  MythaiaTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: MythaiaTunnel
        excludes: ["**/*.md", "**/*.h"]
      - path: ../app/src/main/assets/Rules.db
        buildPhase: resources
      # lwIP, the userspace TCP/IP stack behind TUN mode: exactly the files
      # app/src/main/jni/CMakeLists.txt compiles for Android. Vendored C, so
      # its warnings are silenced.
      - path: ../app/src/main/jni/lwip/src/core
        compilerFlags: ["-w"]
      - path: ../app/src/main/jni/lwip/port/sys_arch.c
        compilerFlags: ["-w"]
      - path: ../app/src/main/jni/lwip/lwip_bridge.c
        compilerFlags: ["-w"]
    dependencies:
      - package: MythaiaKit
      - sdk: NetworkExtension.framework
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: MythaiaTunnel/Tun/MythaiaTunnel-Bridging-Header.h
        # lwIP defines struct ip6_hdr and icmp6_hdr itself; with Clang modules
        # on, the system's definitions of the same names collide with them.
        CLANG_ENABLE_MODULES: "NO"
        # The lwIP headers; not app/src/main/jni/compat, whose os/log.h is the
        # Android stand-in for the real one lwip_bridge.c uses here.
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../app/src/main/jni/lwip
          - $(SRCROOT)/../app/src/main/jni/lwip/src/include
          - $(SRCROOT)/../app/src/main/jni/lwip/port
          - $(SRCROOT)/../app/src/main/jni/lwip/port/arch
        PRODUCT_BUNDLE_IDENTIFIER: $(MYTHAIA_BUNDLE_ID).Tunnel
        PRODUCT_NAME: MythaiaTunnel
        INFOPLIST_FILE: MythaiaTunnel/Info.plist
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Mythaia Tunnel
        CODE_SIGN_ENTITLEMENTS: MythaiaTunnel/MythaiaTunnel.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"

  # The home-screen widget (status and a connect button) and, on iOS 18, the
  # Control Center toggle. It reads the state the app keeps in the App Group
  # and starts or stops the app's VPN configuration.
  MythaiaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MythaiaWidget
        excludes: ["**/*.md"]
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MYTHAIA_BUNDLE_ID).Widget
        PRODUCT_NAME: MythaiaWidget
        INFOPLIST_FILE: MythaiaWidget/Info.plist
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Mythaia Pro
        CODE_SIGN_ENTITLEMENTS: MythaiaWidget/MythaiaWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
