name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core library
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew :core:test --stacktrace
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-report
          path: core/build/reports/tests/

  android:
    name: Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, unit tests and lint
        run: ./gradlew :app:assembleDebug :wear:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            app/build/reports/
            wear/build/reports/

  windows:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew :desktop:test --stacktrace
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-report
          path: desktop/build/reports/tests/
