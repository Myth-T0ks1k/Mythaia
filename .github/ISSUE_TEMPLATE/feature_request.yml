name: Feature request
description: An idea for Mythaia.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: How you would like it to work.
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      multiple: true
      options:
        - Android
        - Wear OS
        - Windows
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other clients that do this, or workarounds you use now.
